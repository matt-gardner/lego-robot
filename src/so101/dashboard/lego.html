<!doctype html>
<html lang="en" data-base-path="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LEGO catalogs and generations</title>
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="stylesheet" href="/data.css">
  <script src="/lego.js" defer></script>
</head>
<body>
  <header><h1>LEGO catalogs and generations</h1><a href="/data">Training data browser</a></header>
  <main class="data-main">
    <p class="context">Imported geometry is not physical qualification or robot competence. Historical acceptance and split labels are never upgraded.</p>
    <p id="lego-error" role="alert"></p>
    <div class="data-filters">
      <label>Catalog / generation<select id="lego-release"></select></label>
      <label>Tags / part / task / pile / acceptance / audit<input id="lego-search" type="search"></label>
      <label>Part status<select id="lego-status"><option value="">All</option><option>imported</option><option>prepared</option><option>verified</option><option>unavailable</option></select></label>
      <button id="lego-refresh">Refresh releases</button>
    </div>
    <p id="lego-identity" class="hint"></p>
    <p id="lego-feedback" role="status"></p>
    <h2 id="lego-count"></h2>
    <div id="lego-grid" class="data-grid"></div>
    <div class="data-pagination"><button id="lego-previous">Previous</button><button id="lego-next">Next</button></div>
    <dialog id="lego-detail">
      <button id="lego-close">Close</button>
      <label>Recorded frame<select id="lego-frame"></select></label>
      <p id="lego-frame-identity"></p>
      <div class="detail-previews"><img id="lego-wrist" alt="Recorded wrist frame" hidden><img id="lego-external" alt="Recorded external frame" hidden></div>
      <pre id="lego-metadata"></pre>
    </dialog>
  </main>
</body>
</html>
