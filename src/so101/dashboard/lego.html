<!doctype html>
<html lang="en" data-base-path="" data-browser-mode="parts">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LEGO catalogs and generations</title>
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="stylesheet" href="/data.css">
  <link rel="stylesheet" href="/lego.css">
  <script src="/part-viewer.js" defer></script>
  <script src="/lego.js" defer></script>
</head>
<body>
  <header><h1>LEGO parts</h1><a href="/lego">Parts</a><a href="/examples">Recorded examples</a><a href="/data">Training data browser</a></header>
  <main class="data-main">
    <p class="context">Browse parts for simulation training. Select a part to inspect its geometry and print or sticker variants.</p>
    <p id="lego-error" role="alert"></p>
    <div class="catalog-toolbar">
      <label>Readiness<select id="lego-readiness"><option value="ready">Training ready</option><option value="not_ready">In catalog, not training ready</option></select></label>
      <label>Part type<select id="lego-family"><option value="">All types</option></select></label>
      <label>Footprint<select id="lego-footprint"><option value="">All footprints</option></select></label>
      <label>Decoration<select id="lego-decoration"><option value="">All decorations</option></select></label>
      <button id="lego-refresh">Refresh parts</button>
    </div>
    <p id="lego-catalog-note" class="hint"></p>
    <h2 id="lego-count"></h2>
    <div id="lego-grid" class="data-grid catalog-grid"></div>
    <div class="data-pagination"><button id="lego-previous">Previous</button><button id="lego-next">Next</button></div>
    <dialog id="lego-detail">
      <div class="part-detail-heading"><h2 id="lego-part-title"></h2><button id="lego-close">Close</button></div>
      <div class="part-detail-layout">
        <div><canvas id="lego-geometry" width="800" height="600" tabindex="0" aria-label="Part geometry. Drag to rotate, scroll to zoom, or use arrow keys."></canvas><p id="lego-preview-status" role="status"></p></div>
        <div><p id="lego-part-summary"></p><h3>Print and sticker variants</h3><p id="lego-variant-note"></p><div id="lego-variants" class="part-variants"></div></div>
      </div>
      <div id="lego-recording">
      <p id="lego-example-scope"></p>
      <button id="lego-play-frames">Play recorded views</button>
      <label>Recorded frame<select id="lego-frame"></select></label>
      <p id="lego-frame-identity"></p>
      <div class="detail-previews"><img id="lego-wrist" alt="Recorded wrist frame" hidden><img id="lego-external" alt="Recorded external frame" hidden></div>
      </div>
      <details><summary>Technical metadata and immutable identity</summary><pre id="lego-metadata"></pre></details>
    </dialog>
  </main>
</body>
</html>
