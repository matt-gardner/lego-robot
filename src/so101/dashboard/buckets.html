<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data buckets</title><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="buckets.css"></head>
<body><!-- dashboard-header -->
<main><p id="status" role="status">Loading published bucket population...</p>

<section id="populations" aria-label="All bucket and task populations"></section>

<p id="count"></p><div id="problems"></div><button id="more" hidden>Show more problems</button>
</main><script src="buckets.js"></script></body></html>
